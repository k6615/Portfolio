    // Component: Certifications Section (with interactive upload, credential verification URL, and editable issuer)
    function Certifications({ initialCertifications, onShowToast }) {
      const [certs, setCerts] = useState(() => {
        try {
          const saved = localStorage.getItem("karan_portfolio_certs");
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return initialCertifications;
      });

      const [activeCertForEdit, setActiveCertForEdit] = useState(null);
      const [activeCertForPreview, setActiveCertForPreview] = useState(null);

      const updateCert = (id, fields) => {
        const updated = certs.map((c) => (c.id === id ? { ...c, ...fields } : c));
        setCerts(updated);
        try {
          localStorage.setItem("karan_portfolio_certs", JSON.stringify(updated));
        } catch (e) {}
      };

      const handleImageUpload = (certId, e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          updateCert(certId, { imageUrl: reader.result });
          if (onShowToast) onShowToast("Certificate image uploaded successfully!");
        };
        reader.readAsDataURL(file);
      };

      return (
        <section id="certifications" className="section" style={{ background: "var(--bg-surface)" }}>
          <div className="container">
            <div className="section-header">
              <div className="section-badge">Verified Credentials</div>
              <h2 className="section-title">Certifications</h2>
              <p className="section-subtitle">
                Professional certifications and skill assessments. Click Edit to customize URLs or upload certificates.
              </p>
            </div>

            <div className="certs-grid">
              {certs.map((cert) => (
                <div key={cert.id} className="cert-card">
                  <div className="cert-header">
                    <div className="cert-icon-box" aria-hidden="true">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <circle cx="12" cy="8" r="7"></circle>
                        <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                      </svg>
                    </div>
                    <span className={`cert-status-badge ${cert.status === "Verified" ? "verified" : ""}`}>
                      {cert.status || "Assessment"}
                    </span>
                  </div>

                  <h3 className="cert-title">{cert.title}</h3>

                  <div className="cert-issuer-row">
                    <span className="cert-issuer">{cert.issuer || "Issuing Organization"}</span>
                    {cert.isIssuerEditable && (
                      <button
                        type="button"
                        className="cert-issuer-editable-btn"
                        onClick={() => setActiveCertForEdit(cert)}
                        title="Click to edit issuing organization"
                      >
                        (Edit Organization)
                      </button>
                    )}
                  </div>

                  <p className="cert-description">{cert.description}</p>

                  {/* Certificate Image or Upload Box */}
                  <div className="cert-preview-box">
                    {cert.imageUrl ? (
                      <img
                        src={cert.imageUrl}
                        alt={`${cert.title} Preview`}
                        className="cert-preview-img"
                        onClick={() => setActiveCertForPreview(cert)}
                        title="Click to expand certificate"
                      />
                    ) : (
                      <div className="cert-doc-preview" onClick={() => setActiveCertForEdit(cert)} style={{ cursor: "pointer" }} title="Click to view details">
                        <div className="cert-doc-header">
                          <svg className="cert-doc-seal" viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="8" r="7"></circle>
                            <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                          </svg>
                          <span>Official Certificate</span>
                        </div>
                        <div className="cert-doc-name">Karan</div>
                        <div className="cert-doc-title">{cert.title}</div>
                        <div className="cert-doc-org">{cert.issuer}</div>
                        <div className="cert-doc-footer">Click &apos;Upload Image&apos; to attach document</div>
                      </div>
                    )}
                  </div>

                  {/* Actions: Upload Image & Verify URL */}
                  <div className="cert-actions-row">
                    <div className="cert-action-btn-group">
                      <label className="cert-upload-btn-label" style={{ flex: 1, justifyContent: "center" }}>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                          <polyline points="17 8 12 3 7 8"></polyline>
                          <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span>{cert.imageUrl ? "Change Image" : "Upload Image"}</span>
                        <input
                          type="file"
                          accept="image/*"
                          style={{ display: "none" }}
                          onChange={(e) => handleImageUpload(cert.id, e)}
                        />
                      </label>

                      <button
                        type="button"
                        className="btn btn-secondary btn-sm"
                        onClick={() => setActiveCertForEdit(cert)}
                        title="Edit credentials and link"
                      >
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                          <path d="M12 20h9"></path>
                          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                        </svg>
                        <span>Edit</span>
                      </button>
                    </div>

                    {cert.credentialUrl ? (
                      <a
                        href={cert.credentialUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="btn btn-primary btn-sm"
                        style={{ width: "100%" }}
                      >
                        <span>Verify Credential</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                          <polyline points="15 3 21 3 21 9"></polyline>
                          <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                      </a>
                    ) : (
                      <button
                        type="button"
                        className="btn btn-outline btn-sm"
                        style={{ width: "100%" }}
                        onClick={() => setActiveCertForEdit(cert)}
                      >
                        <span>+ Add Verification URL</span>
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>

            {/* Modal: Edit Certificate Details */}
            {activeCertForEdit && (
              <div className="modal-backdrop" onClick={() => setActiveCertForEdit(null)}>
                <div className="modal-container" onClick={(e) => e.stopPropagation()}>
                  <div className="modal-header">
                    <h3 className="modal-title">Edit Certificate Details</h3>
                    <button
                      type="button"
                      className="modal-close-btn"
                      onClick={() => setActiveCertForEdit(null)}
                    >
                      &times;
                    </button>
                  </div>

                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      setActiveCertForEdit(null);
                      if (onShowToast) onShowToast("Certificate details saved!");
                    }}
                  >
                    <div className="form-group">
                      <label className="form-label">Certificate Title</label>
                      <input
                        type="text"
                        className="form-control"
                        value={activeCertForEdit.title}
                        onChange={(e) => {
                          const val = e.target.value;
                          setActiveCertForEdit({ ...activeCertForEdit, title: val });
                          updateCert(activeCertForEdit.id, { title: val });
                        }}
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">
                        Issuing Organization
                        {activeCertForEdit.isIssuerEditable && (
                          <span style={{ fontSize: "0.8rem", color: "#2563eb", marginLeft: "0.5rem" }}>
                            (Editable as requested)
                          </span>
                        )}
                      </label>
                      <input
                        type="text"
                        className="form-control"
                        value={activeCertForEdit.issuer}
                        placeholder="e.g. Google Cloud, Coursera, HackerRank"
                        onChange={(e) => {
                          const val = e.target.value;
                          setActiveCertForEdit({ ...activeCertForEdit, issuer: val });
                          updateCert(activeCertForEdit.id, { issuer: val });
                        }}
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">Credential Verification URL</label>
                      <input
                        type="url"
                        className="form-control"
                        value={activeCertForEdit.credentialUrl || ""}
                        placeholder="https://www.hackerrank.com/certificates/..."
                        onChange={(e) => {
                          const val = e.target.value;
                          setActiveCertForEdit({ ...activeCertForEdit, credentialUrl: val });
                          updateCert(activeCertForEdit.id, { credentialUrl: val });
                        }}
                      />
                      <small style={{ color: "var(--text-muted)", display: "block", marginTop: "0.3rem" }}>
                        Paste your direct verification link or credential ID page.
                      </small>
                    </div>

                    <div className="modal-actions">
                      <button
                        type="button"
                        className="btn btn-secondary"
                        onClick={() => setActiveCertForEdit(null)}
                      >
                        Cancel
                      </button>
                      <button type="submit" className="btn btn-primary">
                        Save Changes
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal: Full-screen Preview */}
            {activeCertForPreview && (
              <div className="modal-backdrop" onClick={() => setActiveCertForPreview(null)}>
                <div className="modal-container" style={{ maxWidth: "760px" }} onClick={(e) => e.stopPropagation()}>
                  <div className="modal-header">
                    <h3 className="modal-title">{activeCertForPreview.title}</h3>
                    <button
                      type="button"
                      className="modal-close-btn"
                      onClick={() => setActiveCertForPreview(null)}
                    >
                      &times;
                    </button>
                  </div>
                  <div style={{ textAlign: "center", padding: "1rem 0" }}>
                    <img
                      src={activeCertForPreview.imageUrl}
                      alt={activeCertForPreview.title}
                      style={{ width: "100%", maxHeight: "500px", objectFit: "contain", borderRadius: "8px" }}
                    />
                  </div>
                  <div className="modal-actions">
                    {activeCertForPreview.credentialUrl && (
                      <a
                        href={activeCertForPreview.credentialUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="btn btn-primary btn-sm"
                      >
                        Open Verification Page
                      </a>
                    )}
                    <button
                      type="button"
                      className="btn btn-secondary btn-sm"
                      onClick={() => setActiveCertForPreview(null)}
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </section>
      );
    }

            {/* Modal: Edit LinkedIn Profile URL */}
            {isEditingLinkedIn && (
              <div className="modal-backdrop" onClick={() => setIsEditingLinkedIn(false)}>
                <div className="modal-container" onClick={(e) => e.stopPropagation()}>
                  <div className="modal-header">
                    <h3 className="modal-title">Edit LinkedIn Profile URL</h3>
                    <button
                      type="button"
                      className="modal-close-btn"
                      onClick={() => setIsEditingLinkedIn(false)}
                    >
                      &times;
                    </button>
                  </div>

                  <form onSubmit={saveLinkedIn}>
                    <div className="form-group">
                      <label className="form-label">LinkedIn Profile URL</label>
                      <input
                        type="url"
                        required
                        className="form-control"
                        placeholder="https://www.linkedin.com/in/your-profile"
                        value={tempLinkedIn}
                        onChange={(e) => setTempLinkedIn(e.target.value)}
                      />
                      <small style={{ color: "var(--text-muted)", display: "block", marginTop: "0.3rem" }}>
                        Paste your LinkedIn profile URL. It will update the link on the portfolio.
                      </small>
                    </div>

                    <div className="modal-actions">
                      <button
                        type="button"
                        className="btn btn-secondary"
                        onClick={() => setIsEditingLinkedIn(false)}
                      >
                        Cancel
                      </button>
                      <button type="submit" className="btn btn-primary">
                        Save URL
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        </section>
      );
    }

    // Component: Footer
    function Footer({ personal }) {
      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      return (
        <footer className="site-footer">
          <div className="container">
            <div className="footer-top">
              <div className="footer-brand">
                <a href="#hero" className="brand-logo" onClick={scrollToTop}>
                  <span>{personal.name}</span>
                  <span className="brand-dot" aria-hidden="true"></span>
                </a>
                <p style={{ color: "var(--text-muted)", fontSize: "0.9375rem" }}>
                  {personal.role}
                </p>
              </div>

              <ul className="footer-links">
                <li><a href="#hero">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#certifications">Certifications</a></li>
                <li><a href="#contact">Contact</a></li>
              </ul>

              <div>
                <button
                  type="button"
                  className="btn btn-secondary btn-sm"
                  onClick={scrollToTop}
                  title="Scroll back to top"
                >
                  <span>Back to Top</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polyline points="18 15 12 9 6 15"></polyline>
                  </svg>
                </button>
              </div>
            </div>

            <div className="footer-bottom">
              <p>&copy; {new Date().getFullYear()} {personal.name}. All rights reserved.</p>
              <p style={{ display: "flex", alignItems: "center", gap: "0.4rem" }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span>{personal.location}</span>
              </p>
            </div>
          </div>
        </footer>
      );
    }

    // Main App Component
    function App() {
      const [activeSection, setActiveSection] = useState("hero");
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (message) => {
        setToastMessage(message);
        setTimeout(() => {
          setToastMessage(null);
        }, 3200);
      };

      useEffect(() => {
        const handleScroll = () => {
          const sections = ["hero", "skills", "projects", "certifications", "contact"];
          const scrollPos = window.scrollY + 220;

          for (const sectionId of sections) {
            const el = document.getElementById(sectionId);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPos >= top && scrollPos < top + height) {
                setActiveSection(sectionId);
                break;
              }
            }
          }
        };

        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      return (
        <div className="portfolio-app">
          <Navbar
            personal={portfolioData.personal}
            activeSection={activeSection}
            onNavigate={(href) => {
              const id = href.replace("#", "");
              const el = document.getElementById(id);
              if (el) {
                el.scrollIntoView({ behavior: "smooth" });
              }
            }}
          />

          <main>
            <Hero personal={portfolioData.personal} hero={portfolioData.personal} />
            <Skills skills={portfolioData.skills} />
            <Projects projects={portfolioData.projects} />
            <Certifications initialCertifications={portfolioData.certifications} onShowToast={showToast} />
            <Contact personal={portfolioData.personal} onShowToast={showToast} />
          </main>

          <Footer personal={portfolioData.personal} />

          {toastMessage && (
            <div className="toast-notice" role="alert">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="2.5">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    // Mount to root
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
